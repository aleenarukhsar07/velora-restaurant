name: Velora CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check HTML file
        run: test -f index.html

      - name: Check CSS file
        run: test -f style.css

      - name: Check JavaScript file
        run: test -f script.js

      - name: Validate HTML
        run: |
          grep -q "<html" index.html
          grep -q "</html>" index.html

      - name: Validate CSS
        run: |
          test -s style.css

      - name: Validate JavaScript
        run: |
          test -s script.js

      - name: CI Success
        run: echo "✅ Velora CI Pipeline Passed Successfully!"